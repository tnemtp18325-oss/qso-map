name: Update spots map

# GitHub's scheduler is unreliable for short intervals, so this starts once an
# hour and then refreshes the spots map every 5 minutes itself for that hour.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths: ["make_spots.py", ".github/workflows/update-spots.yml"]

permissions:
  contents: write

concurrency:
  group: spots
  cancel-in-progress: true   # a new run replaces the old loop

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install matplotlib requests

      - name: Refresh spots every 5 minutes for an hour
        env:
          MY_CALL: ${{ vars.MY_CALL }}
          MY_GRID: ${{ vars.MY_GRID }}
          SPOT_CALLS: ${{ vars.SPOT_CALLS }}
        run: |
          git config user.name "qso-map-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 12); do
            start=$SECONDS
            git pull --rebase --quiet || true
            python make_spots.py || echo "spots run failed"
            git add data/spots.json docs/spots-map.png
            if ! git diff --cached --quiet; then
              git commit -m "Update spots map" --quiet
              for try in 1 2 3; do
                git pull --rebase --quiet && git push --quiet && break
                sleep 5
              done
            fi
            if [ "$i" -lt 12 ]; then
              wait=$(( 300 - (SECONDS - start) ))
              if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
            fi
          done
